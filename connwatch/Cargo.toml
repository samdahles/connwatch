[package]
name = "connwatch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
directories = "5"
globe = { git = "https://github.com/adamsky/globe" }
maxminddb = "0.24"
pcap = "1.1"
pnet_packet = "0.34"
ratatui = "0.26"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs"] }
trust-dns-resolver = { version = "0.23", default-features = false, features = ["tokio-runtime"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
